[workspace]
members = [
    "crates/etyma-cli",
    "crates/etyma-engine",
    "crates/etyma-engine-client",
    "crates/etyma-engine-types",
    "crates/etyma-knowledge",
    "crates/etyma-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.102"
async-openai = { version = "=0.38.1", default-features = false, features = ["chat-completion", "rustls"] }
base64 = "=0.22.1"
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
dirs = "=6.0.0"
futures = "=0.3.32"
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rig-core = "=0.38.2"
ring = "=0.17.14"
# graphqlite 0.5.0 allows rusqlite >=0.31; keep it below 0.40 until
# libsqlite3-sys 0.38.x no longer uses unstable cfg_select in build.rs.
rusqlite = "=0.39.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
thiserror = "=2.0.17"
tokio = { version = "=1.52.3", features = ["rt", "time"] }
uuid = { version = "=1.23.1", features = ["serde", "v7"] }
