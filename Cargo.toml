[workspace]
members = [
    "crates/hyprduck-cli",
    "crates/hyprduck-engine",
    "crates/hyprduck-engine-client",
    "crates/hyprduck-engine-types",
    "crates/hyprduck-knowledge",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.102"
base64 = "=0.22.1"
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
dirs = "=6.0.0"
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
thiserror = "=2.0.17"
uuid = { version = "=1.23.1", features = ["serde", "v7"] }
