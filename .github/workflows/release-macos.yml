name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-15

    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Validate release tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version v$TAG_VERSION does not match apps/desktop/package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Validate signing and notarization secrets
        run: |
          set -euo pipefail
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Verify Rust formatting
        run: cargo fmt --check

      - name: Run MCP contract test
        run: cargo test -p hyprduck-cli --test mcp_server mcp_server_exposes_read_and_agent_session_write_brain_tools

      - name: Build signed and notarized macOS artifacts
        working-directory: apps/desktop
        run: bun run release:pack:mac

      - name: Validate notarized artifacts
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          APP_PATH="apps/desktop/release/electron/mac-arm64/HyprDuck.app"
          DMG_PATH="apps/desktop/release/electron/HyprDuck-${VERSION}-mac-arm64.dmg"
          ZIP_PATH="apps/desktop/release/electron/HyprDuck-${VERSION}-mac-arm64.zip"
          UPDATE_PATH="apps/desktop/release/electron/latest-mac.yml"
          DMG_NOTARIZED_MARKER="apps/desktop/release/electron/.dmg-notarized"
          test -d "$APP_PATH"
          test -f "$DMG_PATH"
          test -f "$ZIP_PATH"
          test -f "$UPDATE_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          if [[ -f "$DMG_NOTARIZED_MARKER" ]]; then
            xcrun stapler validate "$DMG_PATH"
          else
            echo "DMG notarization marker is absent; validating notarized app bundle only."
          fi
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          for helper in "$APP_PATH"/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-*/spawn-helper; do
            test -x "$helper"
            codesign --verify --strict --verbose=4 "$helper"
          done

      - name: Validate mounted DMG artifacts
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          DMG_PATH="apps/desktop/release/electron/HyprDuck-${VERSION}-mac-arm64.dmg"
          MOUNT_OUTPUT="$(hdiutil attach "$DMG_PATH" -nobrowse -readonly)"
          MOUNT_POINT="$(printf '%s\n' "$MOUNT_OUTPUT" | sed -n 's#.*\(/Volumes/.*\)$#\1#p' | tail -n 1)"
          if [[ -z "$MOUNT_POINT" ]]; then
            echo "Failed to resolve DMG mount point." >&2
            printf '%s\n' "$MOUNT_OUTPUT" >&2
            exit 1
          fi
          trap 'hdiutil detach "$MOUNT_POINT"' EXIT
          APP_PATH="$MOUNT_POINT/HyprDuck.app"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          for helper in "$APP_PATH"/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-*/spawn-helper; do
            test -x "$helper"
            codesign --verify --strict --verbose=4 "$helper"
          done

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          PREVIOUS_TAG="$(gh release list \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 20 \
            --json tagName \
            --jq ".[] | select(.tagName != \"v${VERSION}\") | .tagName" \
            | head -n 1 || true)"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -v "^v${VERSION}$" | head -n 1 || true)"
          fi
          NOTES_ARGS=(-f "tag_name=v${VERSION}")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            NOTES_ARGS+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi
          RELEASE_BODY_PATH="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${NOTES_ARGS[@]}" \
            --jq .body > "$RELEASE_BODY_PATH"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            {
              printf '\n\n## Main commits\n'
              git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS_TAG}..HEAD"
              printf '\n\n**Full commit log**: https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$VERSION"
            } >> "$RELEASE_BODY_PATH"
          fi
          gh release create "v${VERSION}" \
            "apps/desktop/release/electron/HyprDuck-${VERSION}-mac-arm64.dmg" \
            "apps/desktop/release/electron/HyprDuck-${VERSION}-mac-arm64.zip" \
            "apps/desktop/release/electron/latest-mac.yml" \
            --title "HyprDuck v${VERSION}" \
            --notes-file "$RELEASE_BODY_PATH" \
            --verify-tag
